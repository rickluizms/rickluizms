<svg width="850" height="430" viewBox="0 0 850 430"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip paths used to reveal each command left-to-right (typing effect) -->
    <clipPath id="clipCmdA">
      <rect x="25" y="63" width="0" height="25">
        <animate attributeName="width" from="0" to="85" dur="0.6s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="clipCmdB">
      <rect x="25" y="126" width="0" height="25">
        <animate attributeName="width" from="0" to="95" dur="0.65s" begin="1.6s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="clipCmdC">
      <rect x="25" y="212" width="0" height="25">
        <animate attributeName="width" from="0" to="78" dur="0.5s" begin="2.95s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="clipCmdD">
      <rect x="25" y="298" width="0" height="25">
        <animate attributeName="width" from="0" to="115" dur="0.8s" begin="4.15s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="clipCmdE">
      <rect x="25" y="369" width="0" height="25">
        <animate attributeName="width" from="0" to="30" dur="0.2s" begin="5.65s" fill="freeze"/>
      </rect>
    </clipPath>

    <style>
      .terminal {
        font-family: "SFMono-Regular", "Cascadia Code",
                     "Roboto Mono", Consolas, monospace;
      }

      .command {
        fill: #58a6ff;
        font-weight: 600;
      }

      /* Todos os outputs usam a mesma cor padrão */
      .output {
        fill: #c9d1d9;
      }

      .muted {
        fill: #8b949e;
      }
    </style>
  </defs>


  <!-- ========================= -->
  <!-- TERMINAL WINDOW            -->
  <!-- ========================= -->

  <rect
    x="0"
    y="0"
    width="850"
    height="430"
    rx="14"
    fill="url(#bg)"
    stroke="#30363d"
    stroke-width="1"
  />


  <!-- ========================= -->
  <!-- TITLE BAR                  -->
  <!-- ========================= -->

  <rect x="0" y="0" width="850" height="45" rx="14" fill="#161b22"/>
  <rect x="0" y="30" width="850" height="15" fill="#161b22"/>

  <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="22" r="6" fill="#27c93f"/>

  <text x="425" y="27" text-anchor="middle" class="terminal muted" font-size="13">
    rickluizms@github: ~
  </text>


  <!-- ========================= -->
  <!-- TERMINAL CONTENT            -->
  <!-- ========================= -->

  <!-- whoami -->
  <g clip-path="url(#clipCmdA)">
    <text x="30" y="82" class="terminal command" font-size="15">$ whoami</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.0s" fill="freeze"/>
    <text x="30" y="108" class="terminal output" font-size="15">Luiz</text>
  </g>


  <!-- aboutme -->
  <g clip-path="url(#clipCmdB)">
    <text x="30" y="145" class="terminal command" font-size="15">$ aboutme</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.35s" fill="freeze"/>
    <text x="30" y="171" class="terminal output" font-size="14">Cientista de Dados focando em agentes de IA,</text>
    <text x="30" y="194" class="terminal output" font-size="14">Gen AI, LLMs, RAG e sistemas inteligentes.</text>
  </g>


  <!-- stack -->
  <g clip-path="url(#clipCmdC)">
    <text x="30" y="231" class="terminal command" font-size="15">$ stack</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.55s" fill="freeze"/>
    <text x="30" y="257" class="terminal output" font-size="14">Python • SQL • Java • PostgreSQL • Docker</text>
    <text x="30" y="280" class="terminal output" font-size="14">LangChain • LangGraph • AWS • React • GenAI</text>
  </g>


  <!-- interests -->
  <g clip-path="url(#clipCmdD)">
    <text x="30" y="317" class="terminal command" font-size="15">$ interests</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.05s" fill="freeze"/>
    <text x="30" y="343" class="terminal output" font-size="14">AI • Guitar • Games • Open Source</text>
  </g>


  <!-- Final prompt -->
  <g clip-path="url(#clipCmdE)">
    <text x="30" y="388" class="terminal command" font-size="15">$ </text>
  </g>

  <!-- Animated cursor: fica invisível até o prompt final terminar de "digitar" -->
  <rect x="50" y="374" width="9" height="18" fill="#58a6ff" filter="url(#glow)" opacity="0">
    <animate
      attributeName="opacity"
      values="1;0;1"
      keyTimes="0;0.5;1"
      dur="1s"
      begin="5.85s"
      repeatCount="indefinite"
      fill="freeze"
    />
  </rect>

</svg>
