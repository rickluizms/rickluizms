<svg width="850" height="628" viewBox="0 0 850 628"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clipCmd1"><rect x="25" y="62" width="0" height="23"><animate attributeName="width" from="0" to="75.2" dur="0.5s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipCmd2"><rect x="25" y="120" width="0" height="23"><animate attributeName="width" from="0" to="83.6" dur="0.55s" begin="1.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipCmd3"><rect x="25" y="288" width="0" height="23"><animate attributeName="width" from="0" to="125.6" dur="0.8s" begin="2.85s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipCmd4"><rect x="25" y="508" width="0" height="23"><animate attributeName="width" from="0" to="142.4" dur="0.9s" begin="4.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipCmdFinal"><rect x="25" y="570" width="0" height="23"><animate attributeName="width" from="0" to="24.8" dur="0.2s" begin="6.05s" fill="freeze"/></rect></clipPath>

    <style>
      .terminal { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
      .command { fill: #58a6ff; font-weight: 600; }
      .output { fill: #c9d1d9; }
      .muted { fill: #8b949e; }
    </style>
  </defs>

  <rect x="0" y="0" width="850" height="628" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <rect x="0" y="0" width="850" height="45" rx="14" fill="#161b22"/>
  <rect x="0" y="30" width="850" height="15" fill="#161b22"/>

  <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="22" r="6" fill="#27c93f"/>

  <text x="425" y="27" text-anchor="middle" class="terminal muted" font-size="13">rickluizms@github: ~</text>

  <!-- whoami -->
  <g clip-path="url(#clipCmd1)"><text x="30" y="80" class="terminal command" font-size="14">$ whoami</text></g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.95s" fill="freeze"/>
    <text x="30" y="104" class="terminal output" font-size="14">Luiz</text>
  </g>

  <!-- aboutme -->
  <g clip-path="url(#clipCmd2)"><text x="30" y="138" class="terminal command" font-size="14">$ aboutme</text></g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.25s" fill="freeze"/>
  <line x1="30" y1="168" x2="48" y2="168" stroke="#30363d" stroke-width="1.4"/>
  <line x1="122.80000000000001" y1="168" x2="650" y2="168" stroke="#30363d" stroke-width="1.4"/>
  <line x1="30" y1="168" x2="30" y2="272" stroke="#30363d" stroke-width="1.4"/>
  <line x1="650" y1="168" x2="650" y2="272" stroke="#30363d" stroke-width="1.4"/>
  <line x1="30" y1="272" x2="650" y2="272" stroke="#30363d" stroke-width="1.4"/>
  <text x="56" y="173" class="terminal muted" font-size="13">profile</text>
  <text x="50" y="204" class="terminal output" font-size="14">role → Data Scientist</text>
  <text x="50" y="230" class="terminal output" font-size="14">focus → AI Agents • GenAI • LLMs • RAG</text>
  <text x="50" y="256" class="terminal output" font-size="14">mindset → Data × Intelligence × Automation</text>
  </g>

  <!-- stack --list -->
  <g clip-path="url(#clipCmd3)"><text x="30" y="306" class="terminal command" font-size="14">$ stack --list</text></g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.8s" fill="freeze"/>
  <line x1="30" y1="336" x2="48" y2="336" stroke="#30363d" stroke-width="1.4"/>
  <line x1="106.0" y1="336" x2="650" y2="336" stroke="#30363d" stroke-width="1.4"/>
  <line x1="30" y1="336" x2="30" y2="492" stroke="#30363d" stroke-width="1.4"/>
  <line x1="650" y1="336" x2="650" y2="492" stroke="#30363d" stroke-width="1.4"/>
  <line x1="30" y1="492" x2="650" y2="492" stroke="#30363d" stroke-width="1.4"/>
  <text x="56" y="341" class="terminal muted" font-size="13">stack</text>
  <text x="50" y="372" class="terminal output" font-size="14">languages → Python • SQL • Java</text>
  <text x="50" y="398" class="terminal output" font-size="14">data → PostgreSQL</text>
  <text x="50" y="424" class="terminal output" font-size="14">infra → Docker • AWS</text>
  <text x="50" y="450" class="terminal output" font-size="14">ai → LangChain • LangGraph • GenAI</text>
  <text x="50" y="476" class="terminal output" font-size="14">web → React</text>
  </g>

  <!-- ls ~/interests -->
  <g clip-path="url(#clipCmd4)"><text x="30" y="526" class="terminal command" font-size="14">$ ls ~/interests</text></g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.45s" fill="freeze"/>
    <text x="30" y="550" class="terminal output" font-size="14">AI/ • Guitar/ • Games/ • OpenSource/</text>
  </g>

  <!-- final prompt -->
  <g clip-path="url(#clipCmdFinal)"><text x="30" y="588" class="terminal command" font-size="14">$ </text></g>

  <rect x="50" y="574" width="9" height="18" fill="#58a6ff" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" begin="6.25s" repeatCount="indefinite" fill="freeze"/>
  </rect>

</svg>
